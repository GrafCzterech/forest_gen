name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_load:
        description: "Also run load tests (-m load)"
        required: false
        default: "false"

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      FOREST_PKG: forest_gen_utils

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package + test deps
        run: |
          python -m pip install -e .
          python -m pip install -e ".[vis,export,dev]" || true

      - name: Run unit + integration tests (default)
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_load != 'true' }}
        run: |
          pytest -m "not load"

      - name: Run load tests (manual toggle)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_load == 'true' }}
        run: |
          pytest -m "load"